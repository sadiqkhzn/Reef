name: Reef
options:
  bundleIdPrefix: dev.sadiqkhzn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Reef:
    type: application
    platform: macOS
    sources:
      - path: Reef
        excludes:
          - "Vendor/**"
      - path: Reef/Vendor/mediaremote-adapter/mediaremote-adapter.pl
        buildPhase: resources
      - path: Reef/Vendor/mediaremote-adapter/LICENSE
        buildPhase: resources
    dependencies:
      - framework: Reef/Vendor/mediaremote-adapter/MediaRemoteAdapter.framework
        embed: true
        link: false
        codeSign: true
    info:
      path: Reef/Info.plist
      properties:
        CFBundleName: Reef
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Sadiq Khan. MIT License."
        NSPrincipalClass: NSApplication
        NSBluetoothAlwaysUsageDescription: "Reef shows a live activity when AirPods, headphones, or other Bluetooth devices connect."
        NSCalendarsFullAccessUsageDescription: "Reef shows your next event in the island and a reminder before it starts."
        NSLocationUsageDescription: "Reef uses your approximate location to show local weather in the island."
        NSLocationWhenInUseUsageDescription: "Reef uses your approximate location to show local weather in the island."
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sadiqkhzn.Reef
        PRODUCT_NAME: Reef
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Reef/Reef.entitlements
  ReefTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Reef
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sadiqkhzn.ReefTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Reef.app/Contents/MacOS/Reef
